services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dreamers
      POSTGRES_PASSWORD: dreamers
      POSTGRES_DB: dreamers
      TZ: Europe/Rome
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamers -d dreamers"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dreamers:dreamers@postgres:5432/dreamers
      TZ: Europe/Rome
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dreamers:dreamers@postgres:5432/dreamers
      TZ: Europe/Rome
      PYTHONPATH: /app/backend
    depends_on:
      - api
    restart: unless-stopped

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      # Same-origin /api via Vite proxy (required for HTTPS ngrok / Telegram WebView).
      # Do NOT point at localhost:8000 — that breaks phones and mixed-content.
      VITE_API_BASE_URL: ""
      VITE_PROXY_TARGET: http://api:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
