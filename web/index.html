<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Italian Dreamers</title>
    <!-- Served locally: telegram.org is unreliable from some networks and a hanging
         blocking script leaves the Mini App on a blank screen. -->
    <script src="/telegram-web-app.js"></script>
    <!-- Telegram WebView may keep a stale index.html that points at bundles removed by
         the last deploy; reload once so the fresh index.html is fetched. -->
    <script>
      (function () {
        var KEY = "id_asset_reload";
        window.addEventListener(
          "error",
          function (event) {
            var el = event.target;
            if (!el || (el.tagName !== "SCRIPT" && el.tagName !== "LINK")) return;
            var url = el.src || el.href || "";
            if (url.indexOf("/assets/") === -1) return;
            try {
              if (sessionStorage.getItem(KEY)) return;
              sessionStorage.setItem(KEY, "1");
            } catch (e) {
              return;
            }
            window.location.reload();
          },
          true,
        );
      })();
    </script>
    <style>
      html,
      body {
        background: #1a1511;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
